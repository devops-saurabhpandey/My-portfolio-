<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise MIS Dashboard</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f5f7fb;color:#172033}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 16px #0001}.value{font-size:28px;font-weight:700;margin-top:8px}.muted{color:#64748b}</style></head><body>
  <script>const token=sessionStorage.getItem('mis_access_token'); if(!token){window.location.href='login.html';}</script><h1>Enterprise MIS Dashboard</h1><p class="muted">Portfolio demo dashboard connected to the FastAPI KPI endpoint.</p><div class="grid"><div class="card"><div class="muted">Revenue</div><div id="revenue" class="value">Loading...</div></div><div class="card"><div class="muted">Orders</div><div id="orders" class="value">Loading...</div></div><div class="card"><div class="muted">Customers</div><div id="customers" class="value">Loading...</div></div><div class="card"><div class="muted">Average Order Value</div><div id="aov" class="value">Loading...</div></div></div><script>fetch('/api/v1/kpis').then(r=>r.json()).then(d=>{document.getElementById('revenue').textContent='₹'+d.revenue.toLocaleString('en-IN');document.getElementById('orders').textContent=d.orders.toLocaleString('en-IN');document.getElementById('customers').textContent=d.customers.toLocaleString('en-IN');document.getElementById('aov').textContent='₹'+d.average_order_value.toLocaleString('en-IN')}).catch(()=>document.querySelectorAll('.value').forEach(x=>x.textContent='API unavailable'));</script></body></html>
