<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIS Audit Logs</title><style>body{font-family:Arial;background:#f3f4f6;margin:0;color:#111827}main{max-width:1100px;margin:30px auto;padding:20px;background:#fff;border-radius:14px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}button{padding:9px 14px;border:0;border-radius:7px;cursor:pointer}@media(max-width:700px){main{margin:10px}.table-wrap{overflow:auto}}</style></head><body><main><h1>Audit Logs</h1><p id="status">Loading...</p><div class="table-wrap"><table><thead><tr><th>User</th><th>Action</th><th>Resource</th><th>Details</th><th>Time</th></tr></thead><tbody id="logs"></tbody></table></div><br><button onclick="location.href='index.html'">Back to Dashboard</button></main><script>const token=sessionStorage.getItem('mis_access_token');if(!token)location.href='login.html';fetch('/api/v1/audit-logs',{headers:{Authorization:'Bearer '+token}}).then(async r=>{if(r.status===401||r.status===403){document.getElementById('status').textContent='Admin access required.';return}const d=await r.json();document.getElementById('status').textContent=d.count+' log entries';document.getElementById('logs').innerHTML=d.items.map(x=>'<tr><td>'+x.username+'</td><td>'+x.action+'</td><td>'+x.resource+'</td><td>'+x.details+'</td><td>'+x.created_at+'</td></tr>').join('')}).catch(e=>document.getElementById('status').textContent=e.message);</script></body></html>
